<!DOCTYPE html>
<html lang="en" x-data>
<head>
    <meta charset="UTF-8">
    <title>{{ title if title else 'Mini Store App' }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<nav class="navbar is-dark" role="navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="/">Mini Store</a>
  </div>
  <div class="navbar-menu is-active">
    <div class="navbar-start">
      <a class="navbar-item" href="/items">Items</a>
      <a class="navbar-item" href="/suppliers">Suppliers</a>
      <a class="navbar-item" href="/customers">Customers</a>
      <a class="navbar-item" href="/purchases">Purchases</a>
      <a class="navbar-item" href="/sales">Sales</a>
      <a class="navbar-item" href="/payments">Payments</a>
      <a class="navbar-item" href="/reports/monthly">Reports</a>
      <a class="navbar-item" href="/settings">Settings</a>
    </div>
  </div>
</nav>
<section class="section">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</section>
</body>
</html>
