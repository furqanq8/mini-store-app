{% extends "base.html" %}
{% block content %}
<div class="level">
  <div class="level-left"><h1 class="title">Customer Payments</h1></div>
  <div class="level-right"><a class="button is-primary" href="/payments/new">Record Payment</a></div>
</div>
<table class="table is-fullwidth">
  <thead>
    <tr><th>Date</th><th>Customer</th><th>Reference</th><th>Amount</th></tr>
  </thead>
  <tbody>
  {% for payment in payments %}
    <tr>
      <td>{{ payment.date }}</td>
      <td>{{ customers.get(payment.customer_id).name }}</td>
      <td>{{ payment.reference or '-' }}</td>
      <td>{{ '%.2f'|format(payment.amount) }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
