{% extends "base.html" %}
{% block content %}
<h1 class="title">Record Payment</h1>
<form method="post" action="/payments" class="box">
  <div class="field">
    <label class="label">Customer</label>
    <div class="select is-fullwidth">
      <select name="customer_id" required>
        {% for customer in customers %}
        <option value="{{ customer.id }}">{{ customer.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="field">
    <label class="label">Date</label>
    <div class="control"><input class="input" type="date" name="date" value="{{ today if today else '' }}"></div>
  </div>
  <div class="field">
    <label class="label">Amount</label>
    <div class="control"><input class="input" type="number" step="0.01" name="amount" required></div>
  </div>
  <div class="field">
    <label class="label">Reference</label>
    <div class="control"><input class="input" type="text" name="reference"></div>
  </div>
  <div class="field">
    <button class="button is-primary" type="submit">Save</button>
    <a class="button" href="/payments">Cancel</a>
  </div>
</form>
{% endblock %}
