{% extends "base.html" %}
{% block content %}
<h1 class="title">New Sale</h1>
<form method="post" action="/sales" class="box" x-data="saleForm()">
  <div class="field is-horizontal">
    <div class="field-body">
      <div class="field">
        <label class="label">Customer</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select name="customer_id">
              <option value="">-- walk-in --</option>
              {% for customer in customers %}
              <option value="{{ customer.id }}">{{ customer.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label">Reference</label>
        <div class="control"><input class="input" type="text" name="reference" required></div>
      </div>
      <div class="field">
        <label class="label">Date</label>
        <div class="control"><input class="input" type="date" name="date" value="{{ today }}"></div>
      </div>
    </div>
  </div>
  <div class="field is-horizontal">
    <div class="field-body">
      <div class="field">
        <label class="label">Payment Type</label>
        <div class="select is-fullwidth">
          <select name="payment_type">
            {% for option in ['CASH', 'CREDIT'] %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label">VAT %</label>
        <div class="control"><input class="input" type="number" step="0.01" name="vat_rate" value="{{ vat_rate }}"></div>
      </div>
    </div>
  </div>
  <article class="message is-info">
    <div class="message-body">
      <label class="label">Quick Search SKU/Barcode</label>
      <input class="input" type="text" placeholder="Search" hx-get="/items/search" hx-trigger="keyup changed delay:500ms" hx-target="#search-results" name="search">
      <div id="search-results" class="content"></div>
    </div>
  </article>
  <h2 class="subtitle">Lines</h2>
  <template x-for="(line, index) in lines" :key="index">
    <div class="box">
      <div class="columns">
        <div class="column">
          <label class="label">Item</label>
          <div class="select is-fullwidth">
            <select x-model="line.item_id" x-bind:name="'lines-' + index + '-item_id'" required>
              <option value="">-- select --</option>
              {% for item in items %}
              <option value="{{ item.id }}">{{ item.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="column">
          <label class="label">Quantity</label>
          <input class="input" type="number" step="0.001" x-model.number="line.quantity" x-bind:name="'lines-' + index + '-quantity'" required>
        </div>
        <div class="column">
          <label class="label">Unit Price</label>
          <input class="input" type="number" step="0.0001" x-model.number="line.unit_price" x-bind:name="'lines-' + index + '-unit_price'" required>
        </div>
        <div class="column is-narrow">
          <label class="label">&nbsp;</label>
          <button class="button is-danger" type="button" @click="lines.splice(index,1)" x-show="lines.length > 1">Remove</button>
        </div>
      </div>
    </div>
  </template>
  <div class="field">
    <button class="button is-link" type="button" @click="addLine()">Add Line</button>
  </div>
  <div class="notification is-light">
    <strong>Subtotal:</strong> {{ '{{' }} subtotal().toFixed(2) {{ '}}' }}
  </div>
  <div class="field">
    <button class="button is-primary" type="submit">Save Sale</button>
    <a class="button" href="/sales">Cancel</a>
  </div>
</form>
<script>
function saleForm() {
  return {
    lines: [{item_id: '', quantity: 1, unit_price: 0}],
    addLine() { this.lines.push({item_id: '', quantity: 1, unit_price: 0}); },
    subtotal() {
      return this.lines.reduce((acc, line) => acc + Number(line.quantity || 0) * Number(line.unit_price || 0), 0);
    }
  }
}
</script>
{% endblock %}
